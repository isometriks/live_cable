name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ruby_tests:
    name: Ruby Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        ruby-version: ['3.4']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable

    # The dummy app serves morphdom out of node_modules, so the system tests
    # cannot boot their JavaScript without this.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: yarn

    - name: Install JavaScript dependencies
      run: yarn install --frozen-lockfile

    - name: Run tests
      run: bundle exec rspec

    - name: Check coverage
      uses: joshmfrankel/simplecov-check-action@main
      with:
        minimum_suite_coverage: 80
        minimum_file_coverage: 50
        github_token: ${{ secrets.GITHUB_TOKEN }}

  js_test:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: yarn

    # yarn.lock is the committed lockfile; `npm install` ignores it and
    # re-resolves, so CI could test different versions than local.
    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run Vitest tests
      run: yarn test

  lint:
    name: RuboCop Linting
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI if linting fails

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop --format github
